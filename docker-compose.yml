# docker-compose.yml
services:
  redisdb:
    image: "redis:latest"
    container_name: echoboard_redis
    ports:
      - "26379:6379"
    volumes:
      - ./redisdata:/data
  echoboard_app:
    build: .
    command: sh -c "./wait-for.sh redisdb:6379 -- ./echoboard_app"
    depends_on:
      - redisdb
    ports:
      - "8081:8081"